name: Submit Rigetti Benchmark

on:
  schedule:
    # Every Monday at 11:30 UTC
    - cron: "30 11 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: local simulation only (no API calls, no cost)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  submit:
    name: Submit Rigetti circuits
    runs-on: ubuntu-latest
    environment: quantum-production

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-west-1   # Rigetti Cepheus-1-108Q is in us-west-1

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Submit jobs
        env:
          BRAKET_RESULTS_BUCKET_WEST: ${{ vars.BRAKET_RESULTS_BUCKET_WEST }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          PLATFORM: rigetti_braket
        run: uv run python scripts/submit_benchmark.py

      - name: Commit pending job files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pending/
          git diff --staged --quiet || git commit -m "chore: submit Rigetti benchmark $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash && git push
