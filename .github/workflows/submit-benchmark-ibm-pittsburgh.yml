name: Submit IBM Pittsburgh Benchmark

on:
  schedule:
    # Every Monday at 12:00 UTC
    - cron: "0 12 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: local simulation only (no API calls, no cost)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  submit:
    name: Submit IBM Pittsburgh circuits
    runs-on: ubuntu-latest
    environment: quantum-production

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Submit jobs
        env:
          IBM_QUANTUM_TOKEN: ${{ secrets.IBM_QUANTUM_TOKEN }}
          IBM_QUANTUM_INSTANCE_PAYG: ${{ vars.IBM_QUANTUM_INSTANCE_PAYG }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          PLATFORM: ibm_pittsburgh
        run: uv run python scripts/submit_benchmark.py

      - name: Commit pending job files
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pending/ incidents/
          git diff --staged --quiet || git commit -m "chore: submit IBM Pittsburgh benchmark $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash && git push
